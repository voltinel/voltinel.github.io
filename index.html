<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltinel</title>
<meta name="description" content="A watchful eye on your home battery. Local-first monitoring for Marstek Venus batteries. Coming soon.">
<meta name="theme-color" content="#0B0C10">
<meta property="og:title" content="Voltinel">
<meta property="og:description" content="A watchful eye on your home battery. Coming soon.">
<meta property="og:image" content="https://voltinel.app/icon-512.png">
<meta property="og:url" content="https://voltinel.app/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* Fixel Display by MacPaw (official v1.211, SIL OFL 1.1: fonts/OFL.txt), the app's typeface. */
  @font-face { font-family: "Fixel Display"; font-weight: 400; font-display: swap; src: url(fonts/FixelDisplay-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Fixel Display"; font-weight: 600; font-display: swap; src: url(fonts/FixelDisplay-SemiBold.woff2) format("woff2"); }
  @font-face { font-family: "Fixel Display"; font-weight: 700; font-display: swap; src: url(fonts/FixelDisplay-Bold.woff2) format("woff2"); }
  /* The app's stylistic sets: ss01-05, 07, 08, 10, 11. */
  html { height: 100%; }
  /* On every element: the body's font shorthand resets font-feature-settings, so inheriting from html isn't enough. */
  * { font-feature-settings: "ss01","ss02","ss03","ss04","ss05","ss07","ss08","ss10","ss11"; }
  body {
    min-height: 100%; margin: 0;
    display: grid; place-content: center; text-align: center;
    background: linear-gradient(#232B3D, #0B0C10) fixed;
    color: #C2CBDC; font: 18px/1.5 "Fixel Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  svg { width: 160px; margin: 0 auto 1rem; }
  h1 { margin: 0; color: #F2F5FA; font-size: 3rem; letter-spacing: .02em; }
  p { margin: .5rem 1.5rem; }
  .soon { color: #34D8A0; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: .85rem; }
  a { color: #F2C15A; text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  /* The owl blinks: the approved logo animation (round 8, make_logos8.py). */
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.12); } }
  @media (prefers-reduced-motion: reduce) { .eyes { animation: none; } }
  /* Light: the app's Mist theme with the navy owl, following the visitor's OS. */
  @media (prefers-color-scheme: light) {
    body { background: linear-gradient(#F2F5FA, #E2E6ED) fixed; color: #4A5366; }
    h1 { color: #1B2230; }
    .soon { color: #0B7A5A; }
    a { color: #1F55AE; }
    .o-shade { fill: #2B4B84; } .o-lit { fill: #14284D; } .o-iris { fill: #16C28F; } .o-beak { fill: #E8A21E; }
  }
</style>
</head>
<body>
<main>
  <!-- The owl from the app icon (tmp/logos/final/app/svg/ios.svg), without its tile. -->
  <svg viewBox="200 160 624 760" role="img" aria-label="Voltinel owl logo">
    <path class="o-shade" fill="#C2CBDC" fill-rule="evenodd" d="M227.75,317.97 277.19,182.02 388.41,317.97 635.59,317.97 746.81,182.02 796.25,317.97 512,898.82ZM338.98,478.63a86.51,86.51 0 1 0 173.02,0a86.51,86.51 0 1 0 -173.02,0ZM512,478.63a86.51,86.51 0 1 0 173.02,0a86.51,86.51 0 1 0 -173.02,0ZM457.36,559.06 465.65,555.26 558.35,555.26 566.64,559.06 512,652.89Z"/>
    <path class="o-lit" fill="#F2F5FA" fill-rule="evenodd" d="M227.75,317.97 277.19,182.02 388.41,317.97 512,317.97 512,898.82ZM338.98,478.63a86.51,86.51 0 1 0 173.02,0a86.51,86.51 0 1 0 -173.02,0ZM457.36,559.06 465.65,555.26 512,555.26 512,652.89Z"/>
    <g class="eyes">
      <path class="o-iris" fill="#34D8A0" d="M373.58,478.63a51.91,51.91 0 1 0 103.81,0a51.91,51.91 0 1 0 -103.81,0ZM546.6,478.63a51.91,51.91 0 1 0 103.81,0a51.91,51.91 0 1 0 -103.81,0Z"/>
      <path fill="#0B0C10" d="M403.69,478.63a21.8,21.8 0 1 0 43.6,0a21.8,21.8 0 1 0 -43.6,0ZM576.71,478.63a21.8,21.8 0 1 0 43.6,0a21.8,21.8 0 1 0 -43.6,0Z"/>
    </g>
    <path class="o-beak" fill="#F2C15A" d="M482.34,571.32 541.66,571.32 512,628.17Z"/>
  </svg>
  <h1>Voltinel</h1>
  <p>A watchful eye on your home battery.</p>
  <p>Local-first monitoring for Marstek Venus batteries.</p>
  <p class="soon">Coming soon</p>
  <p><a href="mailto:contact@voltinel.app">contact@voltinel.app</a> · <a href="https://github.com/voltinel">GitHub</a></p>
</main>
</body>
</html>
